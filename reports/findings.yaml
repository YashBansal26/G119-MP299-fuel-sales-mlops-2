# MP299 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G119"          # your group id, e.g. "G042"
problem_id: "MP299"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of zone whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "staff"
    value: 999            # the special number typed instead of a blank
    count: 66            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "nearby_pumps"
    start_date: "2026-04-06"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-24"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 12            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp299-fuel-sales"
  best_run_id: "9f4de37350ea448b9aa8bb3d04e78f22" # the MLflow run id of your v1 model
  registered_model_name: "mp299-fuel-sales-model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    highway_distance_km: 0.0378
    nearby_pumps: 0.0898
    price_rs: 0.0578
    trucks_passing: 0.0291
    temp_c: 3.5073
    staff: 0.079
  most_drifted_feature: "temp_c"
  mae_by_group:            # v1 on later.csv, per value of zone
    'Highway': 1768.35
    'City': 1815.09
    'Industrial': 8949.37
  worst_served_group: "Industrial"
  mae_v1_on_check: 4111.52    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 982.39    # v2 on the same rows
  decision: "promote"           # promote or keep
