data:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  train_clean: data/processed/train_clean.csv

target: litres_per_day
group_column: zone
id_column: record_id
date_column: date

numeric_features:
  - highway_distance_km
  - nearby_pumps
  - price_rs
  - trucks_passing
  - temp_c
  - staff
categorical_features:
  - ownership
  - zone

checks:
  sentinel_candidates: [-1, -99, -999, 999, 9999, 99999]
  sentinel_min_count: 10          # a value must repeat at least this often to count as a sentinel
  unit_factors: [10, 12, 60, 100, 1000]
  unit_ratio_tolerance: 0.15      # group mean / other groups' mean must be within 15% of a factor
  stuck_min_run_days: 7           # a run of one value lasting this many days = stuck sensor
  target_gap_ratio: 2.5           # jump between sorted targets that separates the typos
  leak_corr_threshold: 0.98

reports:
  findings: reports/findings.yaml
  data_checks: reports/data_checks.json
  cleaning: reports/cleaning_report.json

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp299-fuel-sales
  registered_model_name: mp299-fuel-sales-model
  champion_alias: champion

train:
  cv_folds: 5
  random_state: 42
  model_path: models/model.joblib
  candidates:                # each one becomes one MLflow run
    - name: ridge
      model: ridge
      params: {alpha: 1.0}
    - name: random_forest_200
      model: random_forest
      params: {n_estimators: 200, max_depth: 12, min_samples_leaf: 2}
    - name: random_forest_400_deep
      model: random_forest
      params: {n_estimators: 400, max_depth: null, min_samples_leaf: 1}
    - name: gradient_boosting
      model: gradient_boosting
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3}
    - name: hist_gradient_boosting
      model: hist_gradient_boosting
      params: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 15}

monitoring:
  psi_bins: 10
  retrain_fraction: 0.70      # first 70% of later.csv (by date) goes into v2's training data
  promote_min_improvement: 0.15   # v2 must cut MAE on the last 30% by at least 15%
  # v2 settings are chosen on an inner split of the first 70% (its first 70%
  # trains, its last 30% validates); the final check rows are never used to choose.
  # recent_weight = sample weight of later.csv rows (train.csv rows weigh 1).
  v2_candidates:
    - {name: ridge_same_as_v1, model: ridge, params: {alpha: 1.0}, recent_weight: 1}
    - {name: ridge_recent5, model: ridge, params: {alpha: 1.0}, recent_weight: 5}
    - {name: ridge_poly2, model: ridge_poly, params: {alpha: 1.0, degree: 2}, recent_weight: 1}
    - {name: ridge_poly2_recent5, model: ridge_poly, params: {alpha: 1.0, degree: 2}, recent_weight: 5}
    - {name: ridge_poly2_recent10, model: ridge_poly, params: {alpha: 1.0, degree: 2}, recent_weight: 10}
    - {name: ridge_poly2_recent20, model: ridge_poly, params: {alpha: 1.0, degree: 2}, recent_weight: 20}
    - {name: gradient_boosting_recent5, model: gradient_boosting, params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3}, recent_weight: 5}
  report: reports/monitoring.json
  predictions: predictions/holdout_predictions.csv
